name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly RustSec check even when no PRs are opened
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Toolchain for fmt, clippy and the tests; the release workflow uses the same
  # version. Bump both together (docs/RELEASING.md).
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_AUDIT_VERSION: "0.23.0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    if: github.event_name != 'schedule'
    # Ubuntu 22.04 in a container, so the job does not depend on a hosted
    # runner image of that release: the distribution of the .deb build, so the
    # tool tests run against the ewf-tools and gddrescue packages it depends on
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      # Outside root's home, so the unprivileged user can use the toolchain
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
    defaults:
      run:
        # Every step but the two that set the container up runs unprivileged
        shell: runuser -u ci -- bash -e {0}
    steps:
      # A bare ubuntu:22.04: git has to be there before the checkout (without
      # it the checkout is a download with no .git, and build.rs embeds
      # "unknown" revisions), and the tests run as an unprivileged user as on
      # a hosted runner (root would pass permission checks the tests rely on)
      - name: Install git, the build tools and the external tools the tests run
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq gcc libc6-dev util-linux ewf-tools gddrescue
          # The user gets the uid that owns the workspace, so that what it
          # writes there belongs to the runner's user outside the container
          uid=$(stat -c %u "$GITHUB_WORKSPACE")
          [ "$uid" -ne 0 ] || uid=1001
          useradd --create-home --uid "$uid" ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Hand the sources and the toolchain to the unprivileged user
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/tmp"
          chown -R ci: "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"
          # ../dfcore is cloned by that user
          chown ci: "$GITHUB_WORKSPACE/.."

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Tool versions
        run: |
          id
          ewfacquire -V | head -n 1
          ddrescue --version | head -n 1
          cc --version | head -n 1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The tests' scratch space is in the workspace, on the runner's disk as
      # before (dfdisk refuses destinations in memory and reads with O_DIRECT)
      - name: Run the tests (tool tests must run, not skip)
        env:
          DFDISK_REQUIRE_TOOLS: "1"
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/target/tmp"
          cargo test --locked

  msrv:
    name: MSRV (rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Build every target with the locked dependencies
        run: cargo check --locked --all-targets

  nix:
    name: Nix Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package (runs the test suite with libewf and ddrescue, DFDISK_REQUIRE_TOOLS=1)
        run: nix build -L .#default

      - name: The same against libewf-legacy (20140816, the Debian/Ubuntu ewf-tools line)
        run: nix build -L .#checks.x86_64-linux.libewf-legacy

  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
        run: cargo install --locked --version "$CARGO_AUDIT_VERSION" cargo-audit

      # Vulnerabilities always fail; --deny unsound also fails on soundness
      # advisories while leaving unmaintained/yanked notices as warnings so a
      # new unmaintained notice does not unexpectedly break main.
      - name: Audit Cargo.lock
        run: cargo audit --deny unsound
