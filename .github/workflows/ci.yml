name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install forensic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ewf-tools gddrescue smartmontools util-linux udev || sudo apt-get install -y libewf-tools gddrescue smartmontools util-linux udev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --verbose

  nix:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build package (runs the test suite in the Nix sandbox)
        run: nix build -L .#default
