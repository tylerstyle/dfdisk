name: Release

# A pushed tag v<version> builds, checks and publishes a release. Started by
# hand (workflow_dispatch) it is a dry run: every check and build runs, nothing
# is published. See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same toolchain as CI; build tools pinned to exact versions
  RUST_TOOLCHAIN: "1.98.1"
  CROSS_VERSION: "0.2.5"
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Version check
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag, Cargo.toml, Cargo.lock, package.nix and CHANGELOG.md agree
        id: version
        run: |
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          lock_version=$(awk '$0 == "name = \"dfdisk\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          nix_version=$(sed -n 's/^ *version = "\([^"]*\)";.*/\1/p' package.nix | head -n 1)
          echo "Cargo.toml: $cargo_version  Cargo.lock: $lock_version  package.nix: $nix_version"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$lock_version" ] || [ "$cargo_version" != "$nix_version" ]; then
            echo "::error::Cargo.toml ($cargo_version), Cargo.lock ($lock_version) and package.nix ($nix_version) must name the same version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version v$cargo_version"
            exit 1
          fi
          if ! grep -q "^## \[$cargo_version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## [$cargo_version]\""
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  test:
    name: Test & Lint
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Install the external tools the tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y ewf-tools gddrescue

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run the tests (tool tests must run, not skip)
        env:
          DFDISK_REQUIRE_TOOLS: "1"
        run: cargo test --locked

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [check-version, test]
    # ubuntu-22.04 (glibc 2.35), the oldest runner image: the native x86_64 gnu
    # binary needs no newer glibc (the cross targets use the cross images)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install cross ${{ env.CROSS_VERSION }}
        if: matrix.use_cross
        run: cargo install --locked --version "$CROSS_VERSION" cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target "$TARGET"
          else
            cargo build --locked --release --target "$TARGET"
          fi

      - name: Smoke test
        if: startsWith(matrix.target, 'x86_64-')
        run: |
          "target/$TARGET/release/dfdisk" --version
          file "target/$TARGET/release/dfdisk"

      - name: Package tarball
        run: |
          PKG_NAME="dfdisk-v${VERSION}-${TARGET}"
          mkdir -p "$PKG_NAME/docs"
          cp "target/$TARGET/release/dfdisk" "$PKG_NAME/"
          cp README.md CHANGELOG.md LICENSE LICENSE-MIT LICENSE-APACHE "$PKG_NAME/"
          cp docs/*.md "$PKG_NAME/docs/"
          tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"
          sha256sum "$PKG_NAME.tar.gz" > "$PKG_NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dfdisk-v*.tar.gz
            dfdisk-v*.tar.gz.sha256

  build-deb:
    name: Build Debian Package (.deb)
    needs: [check-version, test]
    # Ubuntu 22.04 (glibc 2.35): $auto then asks for no newer C library than that
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout sibling dfcore at the locked revision
        run: |
          rev=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          git clone https://github.com/tylerstyle/dfcore.git ../dfcore
          git -C ../dfcore checkout --detach "$rev"

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-deb ${{ env.CARGO_DEB_VERSION }}
        run: cargo install --locked --version "$CARGO_DEB_VERSION" cargo-deb

      - name: Build Debian package
        run: cargo deb --locked --verbose

      - name: Check the package metadata
        run: |
          DEB="target/debian/dfdisk_${VERSION}-1_amd64.deb"
          test -f "$DEB" || { echo "::error::expected $DEB"; ls target/debian; exit 1; }
          dpkg-deb --info "$DEB"
          depends=$(dpkg-deb --field "$DEB" Depends)
          for pkg in libc6 ewf-tools gddrescue smartmontools util-linux udev hdparm nvme-cli; do
            if ! printf '%s\n' "$depends" | tr ',' '\n' | sed 's/^ *//' | grep -q "^$pkg\b"; then
              echo "::error::Depends lacks $pkg: $depends"
              exit 1
            fi
          done

      - name: Install the package and run it
        run: |
          sudo apt-get update
          sudo apt-get install -y "./target/debian/dfdisk_${VERSION}-1_amd64.deb"
          dfdisk --version
          dpkg -L dfdisk

      - name: Generate deb checksum
        run: |
          cd target/debian
          sha256sum "dfdisk_${VERSION}-1_amd64.deb" > "dfdisk_${VERSION}-1_amd64.deb.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: |
            target/debian/*.deb
            target/debian/*.deb.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-binaries, build-deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
            release-assets/**/*.deb
            release-assets/**/*.deb.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  update-nur:
    name: Update NUR Package
    needs: [check-version, publish-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      NUR_UPDATE_TOKEN: ${{ secrets.NUR_UPDATE_TOKEN }}
    steps:
      - name: Checkout dfdisk
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Calculate release hashes
        id: hashes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.check-version.outputs.version }}"
          TARBALL_URL="https://github.com/tylerstyle/dfdisk/archive/refs/tags/${TAG}.tar.gz"

          echo "Prefetching source hash for $TARBALL_URL..."
          SRC_PREFETCH=$(nix-prefetch-url --unpack "$TARBALL_URL")
          SRC_HASH=$(nix hash convert --to sri "sha256:$SRC_PREFETCH")
          echo "src_hash=$SRC_HASH" >> "$GITHUB_OUTPUT"

          # dfcore is a ../dfcore path dependency; the NUR derivation pins the
          # revision locked in flake.lock. For github inputs narHash equals the
          # fetchFromGitHub hash.
          DFCORE_REV=$(jq -r '.nodes.dfcore.locked.rev' flake.lock)
          DFCORE_HASH=$(jq -r '.nodes.dfcore.locked.narHash' flake.lock)
          if [ -z "$DFCORE_REV" ] || [ "$DFCORE_REV" = null ] || [ -z "$DFCORE_HASH" ] || [ "$DFCORE_HASH" = null ]; then
            echo "flake.lock has no locked dfcore input"
            exit 1
          fi
          {
            echo "dfcore_rev=$DFCORE_REV"
            echo "dfcore_hash=$DFCORE_HASH"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Calculating cargo vendor hash..."
          BUILD_LOG=$(mktemp)
          nix-build -I nixpkgs=channel:nixos-unstable --expr "
            with import <nixpkgs> {};
            rustPlatform.fetchCargoVendor {
              src = fetchFromGitHub {
                owner = \"tylerstyle\";
                repo = \"dfdisk\";
                tag = \"$TAG\";
                hash = \"$SRC_HASH\";
              };
              hash = lib.fakeHash;
            }
          " > "$BUILD_LOG" 2>&1 || true
          cat "$BUILD_LOG"
          CARGO_HASH=$(grep "got:" "$BUILD_LOG" | tail -n1 | awk '{print $2}')

          if [ -z "$CARGO_HASH" ]; then
            echo "Failed to calculate cargoHash"
            exit 1
          fi
          echo "cargo_hash=$CARGO_HASH" >> "$GITHUB_OUTPUT"
          echo "Computed: version=$VERSION, src_hash=$SRC_HASH, cargo_hash=$CARGO_HASH"

      # Only version, hashes and the dfcore pin are rewritten. The recipe's
      # wrapper PATH (runtime tools) and check inputs are maintained by hand:
      # see "NUR recipe" in docs/RELEASING.md.
      - name: Update NUR derivation and push
        run: |
          if [ -z "$NUR_UPDATE_TOKEN" ]; then
            echo "::warning::NUR_UPDATE_TOKEN secret is not set. Skipping automatic update to tylerstyle/nur-packages."
            exit 0
          fi

          git clone "https://x-access-token:${NUR_UPDATE_TOKEN}@github.com/tylerstyle/nur-packages.git" nur-packages
          cd nur-packages
          TARGET_FILE="pkgs/dfdisk/default.nix"
          VERSION="${{ steps.hashes.outputs.version }}"
          SRC_HASH="${{ steps.hashes.outputs.src_hash }}"
          CARGO_HASH="${{ steps.hashes.outputs.cargo_hash }}"

          DFCORE_REV="${{ steps.hashes.outputs.dfcore_rev }}"
          DFCORE_HASH="${{ steps.hashes.outputs.dfcore_hash }}"

          # Each fetchFromGitHub block is addressed by its repo line so the
          # dfdisk and dfcore hashes are updated independently
          sed -i -E "s/version = \"[^\"]+\";/version = \"$VERSION\";/" "$TARGET_FILE"
          sed -i -E "/repo = \"dfdisk\";/,/hash = /s|hash = \"sha256-[^\"]+\";|hash = \"$SRC_HASH\";|" "$TARGET_FILE"
          sed -i -E "/repo = \"dfcore\";/,/hash = /{s|rev = \"[0-9a-f]+\";|rev = \"$DFCORE_REV\";|;s|hash = \"sha256-[^\"]+\";|hash = \"$DFCORE_HASH\";|}" "$TARGET_FILE"
          sed -i -E "s|cargoHash = \"sha256-[^\"]+\";|cargoHash = \"$CARGO_HASH\";|" "$TARGET_FILE"
          grep -q "rev = \"$DFCORE_REV\";" "$TARGET_FILE" || { echo "dfcore pin not updated in $TARGET_FILE"; exit 1; }

          # Remind the maintainer when the recipe's tool list lags behind package.nix
          for tool in libewf ddrescue smartmontools util-linux systemd hdparm nvme-cli; do
            grep -q "$tool" "$TARGET_FILE" || echo "::warning::$TARGET_FILE does not mention $tool; update its wrapper PATH by hand (docs/RELEASING.md)"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet "$TARGET_FILE"; then
            echo "No changes detected in NUR derivation."
          else
            git add "$TARGET_FILE"
            git commit -m "feat(dfdisk): bump to v$VERSION with updated source and cargo hashes"
            git push origin main
            echo "Successfully committed and pushed NUR update for v$VERSION"

            # Notify upstream NUR index to trigger webhook re-evaluation
            curl -s -XPOST "https://nur-update.nix-community.org/update?repo=tylerstyle" || true
          fi
