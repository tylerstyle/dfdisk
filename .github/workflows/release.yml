name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package tarball
        run: |
          BIN_NAME="dfdisk"
          PKG_NAME="dfdisk-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$PKG_NAME/"
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE "$PKG_NAME/"
          tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"
          sha256sum "$PKG_NAME.tar.gz" > "$PKG_NAME.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dfdisk-*.tar.gz
            dfdisk-*.tar.gz.sha256

  build-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        run: cargo deb --verbose

      - name: Generate deb checksum
        run: |
          cd target/debian
          sha256sum *.deb > dfdisk-deb.sha256

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: |
            target/debian/*.deb
            target/debian/dfdisk-deb.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.gz.sha256
            release-assets/**/*.deb
            release-assets/**/dfdisk-deb.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  update-nur:
    name: Update NUR Package
    needs: [publish-release]
    runs-on: ubuntu-latest
    env:
      NUR_UPDATE_TOKEN: ${{ secrets.NUR_UPDATE_TOKEN }}
    steps:
      - name: Checkout dfdisk
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Calculate release hashes
        id: hashes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          TARBALL_URL="https://github.com/tylerstyle/dfdisk/archive/refs/tags/${TAG}.tar.gz"

          echo "Prefetching source hash for $TARBALL_URL..."
          SRC_PREFETCH=$(nix-prefetch-url --unpack "$TARBALL_URL")
          SRC_HASH=$(nix hash convert --to sri "sha256:$SRC_PREFETCH")
          echo "src_hash=$SRC_HASH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Calculating cargo vendor hash..."
          CARGO_HASH=$(nix-build --expr "
            with import <nixpkgs> {};
            rustPlatform.fetchCargoVendor {
              src = fetchFromGitHub {
                owner = \"tylerstyle\";
                repo = \"dfdisk\";
                tag = \"$TAG\";
                hash = \"$SRC_HASH\";
              };
              hash = lib.fakeHash;
            }
          " 2>&1 | grep "got:" | awk '{print $2}' || true)

          if [ -z "$CARGO_HASH" ]; then
            echo "Failed to calculate cargoHash"
            exit 1
          fi
          echo "cargo_hash=$CARGO_HASH" >> "$GITHUB_OUTPUT"
          echo "Computed: version=$VERSION, src_hash=$SRC_HASH, cargo_hash=$CARGO_HASH"

      - name: Update NUR derivation and push
        run: |
          if [ -z "$NUR_UPDATE_TOKEN" ]; then
            echo "::warning::NUR_UPDATE_TOKEN secret is not set. Skipping automatic update to tylerstyle/nur-packages."
            exit 0
          fi

          git clone "https://x-access-token:${NUR_UPDATE_TOKEN}@github.com/tylerstyle/nur-packages.git" nur-packages
          cd nur-packages
          TARGET_FILE="pkgs/dfdisk/default.nix"
          VERSION="${{ steps.hashes.outputs.version }}"
          SRC_HASH="${{ steps.hashes.outputs.src_hash }}"
          CARGO_HASH="${{ steps.hashes.outputs.cargo_hash }}"

          sed -i -E "s/version = \"[^\"]+\";/version = \"$VERSION\";/" "$TARGET_FILE"
          sed -i -E "s|hash = \"sha256-[^\"]+\";|hash = \"$SRC_HASH\";|" "$TARGET_FILE"
          sed -i -E "s|cargoHash = \"sha256-[^\"]+\";|cargoHash = \"$CARGO_HASH\";|" "$TARGET_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet "$TARGET_FILE"; then
            echo "No changes detected in NUR derivation."
          else
            git add "$TARGET_FILE"
            git commit -m "feat(dfdisk): bump to v$VERSION with updated source and cargo hashes"
            git push origin main
            echo "Successfully committed and pushed NUR update for v$VERSION"

            # Notify upstream NUR index to trigger webhook re-evaluation
            curl -s -XPOST "https://nur-update.nix-community.org/update?repo=tylerstyle" || true
          fi
