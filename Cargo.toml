[package]
name = "dfdisk"
version = "0.1.4"
edition = "2021"
authors = ["tylerstyle <tylerstyle@users.noreply.github.com>"]
description = "Modern forensic disk imaging, damaged media rescue and conversion CLI/TUI tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerstyle/dfdisk"
homepage = "https://github.com/tylerstyle/dfdisk"
readme = "README.md"
keywords = ["forensics", "dfir", "e01", "disk-imaging", "tui"]
categories = ["command-line-utilities"]

[package.metadata.deb]
name = "dfdisk"
maintainer = "tylerstyle <tylerstyle@users.noreply.github.com>"
copyright = "2026, tylerstyle"
license-file = ["LICENSE-MIT", "4"]
extended-description = """\
dfdisk is a high-performance terminal utility designed for DFIR examiners,\
 law enforcement investigators, and forensic technicians. It combines\
 hardware discovery, system safety guardrails, automated evidence naming,\
 dual-hash verification (MD5/SHA1/SHA256), and bi-directional conversion\
 between Expert Witness Format (E01) and RAW images with a Ratatui TUI dashboard."""
depends = "ewf-tools | libewf-tools, gddrescue, smartmontools, util-linux, udev"
section = "utils"
priority = "optional"
assets = [
    ["target/release/dfdisk", "usr/bin/dfdisk", "755"],
    ["README.md", "usr/share/doc/dfdisk/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/dfdisk/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/dfdisk/LICENSE-APACHE", "644"],
]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
regex = "1.13"
futures = "0.3"
